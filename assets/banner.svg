<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="glowCyan" cx="25%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowIndigo" cx="80%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="pillBorderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.3" />
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.4" />
    </pattern>

    <style>
      .pulse-slow {
        animation: pulseAnimation 6s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8 12;
        animation: dashAnimation 18s linear infinite;
      }
      .node-float {
        animation: floatAnimation 5s ease-in-out infinite alternate;
      }
      .node-float-alt {
        animation: floatAnimationAlt 6s ease-in-out infinite alternate;
      }
      @keyframes pulseAnimation {
        0% { opacity: 0.25; transform: scale(0.98); }
        100% { opacity: 0.55; transform: scale(1.02); }
      }
      @keyframes dashAnimation {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatAnimation {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatAnimationAlt {
        0% { transform: translateY(0px); }
        100% { transform: translateY(7px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="400" fill="url(#bgGradient)" />
  <rect width="1280" height="400" fill="url(#cyberGrid)" />

  <!-- Ambient Glow Circles -->
  <circle cx="320" cy="140" r="280" fill="url(#glowCyan)" class="pulse-slow" />
  <circle cx="980" cy="240" r="320" fill="url(#glowIndigo)" class="pulse-slow" />
  <circle cx="640" cy="350" r="260" fill="url(#glowViolet)" />

  <!-- Background Dynamic Circuit Paths (Underneath Text) -->
  <g fill="none" stroke-width="1.5" opacity="0.45">
    <path class="dash-flow" stroke="#0ea5e9" d="M -50,100 Q 250,50 480,110 T 900,90 T 1330,130" />
    <path class="dash-flow" stroke="#8b5cf6" d="M -30,280 Q 300,340 600,290 T 1050,330 T 1330,270" />
    <path class="dash-flow" stroke="#10b981" d="M 100,380 Q 450,220 800,360 T 1280,240" />
  </g>

  <!-- Floating Decorative AI Cost / Telemetry Nodes -->
  <g class="node-float">
    <g transform="translate(80, 70)">
      <rect width="130" height="42" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#0284c7" stroke-width="1.2" />
      <circle cx="20" cy="21" r="5" fill="#38bdf8" />
      <text x="34" y="26" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#bae6fd">&#9889; 1.2M Tokens</text>
    </g>
    <g transform="translate(1070, 75)">
      <rect width="135" height="42" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#10b981" stroke-width="1.2" />
      <circle cx="20" cy="21" r="5" fill="#34d399" />
      <text x="34" y="26" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#a7f3d0">&#128176; $0.002 / 1K</text>
    </g>
  </g>

  <g class="node-float-alt">
    <g transform="translate(75, 295)">
      <rect width="145" height="42" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#8b5cf6" stroke-width="1.2" />
      <circle cx="20" cy="21" r="5" fill="#c084fc" />
      <text x="34" y="26" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e9d5ff">&#128737; Budget Caps</text>
    </g>
    <g transform="translate(1060, 290)">
      <rect width="150" height="42" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#f59e0b" stroke-width="1.2" />
      <circle cx="20" cy="21" r="5" fill="#fbbf24" />
      <text x="34" y="26" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#fef3c7">&#128202; Semantic Cache</text>
    </g>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Super Header Pill -->
    <g transform="translate(640, 68)">
      <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="url(#pillBorderGradient)" stroke-width="1.2" />
      <text y="5" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#38bdf8">&#9889; AI FINOPS &amp; TOKEN TELEMETRY</text>
    </g>

    <!-- Main Title -->
    <text x="640" y="155" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-1" fill="url(#titleGradient)">
      AI API Cost Tracking &amp; Token Metrics
    </text>

    <!-- Subtitle / Tagline -->
    <text x="640" y="205" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
      Curated Ecosystem of LLM Gateways, Quota Monitors, Token Telemetry &amp; AI FinOps Tools
    </text>

    <!-- Pill Badges Row -->
    <g transform="translate(640, 260)">
      <!-- Pill 1 -->
      <g transform="translate(-320, 0)">
        <rect x="-75" y="-15" width="150" height="30" rx="15" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
        <text y="5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc">&#129689; Token Metering</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-160, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" fill-opacity="0.9" stroke="#818cf8" stroke-width="1" />
        <text y="5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">&#128682; Proxy Gateways</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(0, 0)">
        <rect x="-75" y="-15" width="150" height="30" rx="15" fill="#0f172a" fill-opacity="0.9" stroke="#c084fc" stroke-width="1" />
        <text y="5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e9d5ff">&#129302; Coding Agents</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(160, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" fill-opacity="0.9" stroke="#34d399" stroke-width="1" />
        <text y="5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">&#128200; Trace FinOps</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(320, 0)">
        <rect x="-75" y="-15" width="150" height="30" rx="15" fill="#0f172a" fill-opacity="0.9" stroke="#f472b6" stroke-width="1" />
        <text y="5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fbcfe8">&#128256; Model Routing</text>
      </g>
    </g>

    <!-- Footnote in banner -->
    <text x="640" y="330" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748b">
      Open Source &amp; Enterprise SaaS &#8226; Budget Governance &#8226; Real-Time Spend Attribution
    </text>
  </g>
</svg>